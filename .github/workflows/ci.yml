name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job A — bash static analysis + version consistency (ubuntu)
# ---------------------------------------------------------------------------
jobs:
  smoke:
    name: "smoke (${{ matrix.os }}, ${{ matrix.shell }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            run-smoke: bash test/smoke.sh
          - os: macos-latest
            shell: bash
            run-smoke: bash test/smoke.sh
          - os: windows-latest
            shell: powershell
            ps-version: "PS 5.1"
            run-smoke: powershell -NoProfile -File test\smoke.ps1
          - os: windows-latest
            shell: pwsh
            ps-version: "pwsh 7"
            run-smoke: pwsh -NoProfile -File test/smoke.ps1
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        shell: ${{ matrix.shell }}
        run: ${{ matrix.run-smoke }}

  # ---------------------------------------------------------------------------
  # Job E — parity: bash vs pwsh7 manifests must match (ubuntu)
  # ---------------------------------------------------------------------------

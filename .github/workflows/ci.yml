name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job A — bash static analysis + version consistency (ubuntu)
# ---------------------------------------------------------------------------
jobs:
  static-bash:
    name: "static-bash"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CRLF guard
        # Fail if any .sh/.ps1/.md contains a Windows CR+LF line ending.
        # .gitattributes pins eol=lf for all three types; this defends it at CI time.
        run: |
          if grep -rlP '\r$' -- *.sh *.ps1 *.md test/*.sh test/*.ps1 2>/dev/null | grep -q .; then
            echo "FAIL: CRLF line endings found in:" >&2
            grep -rlP '\r$' -- *.sh *.ps1 *.md test/*.sh test/*.ps1 2>/dev/null >&2
            exit 1
          fi
          echo "PASS: no CRLF in .sh/.ps1/.md"

      - name: Bash syntax parse
        run: bash -n install.sh test/version-check.sh test/smoke.sh test/parity.sh

      - name: shellcheck
        run: shellcheck install.sh test/version-check.sh test/smoke.sh test/parity.sh

      - name: version-check.sh
        run: bash test/version-check.sh

  # ---------------------------------------------------------------------------
  # Job B — BL-012 gate: PS 5.1 AST parse + -File smoke + PSScriptAnalyzer (Windows)
  # MUST run on windows-latest under the real Windows PowerShell 5.1 shell.
  # pwsh 7 on ubuntu defaults to UTF-8 and would NOT reproduce the failure class.
  # ---------------------------------------------------------------------------
  static-pwsh-windows:
    name: "static-pwsh-windows (BL-012 gate)"
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: AST parse (PS 5.1)
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "PASS: install.ps1 parses under PS 5.1"

      - name: "-File -Version smoke (PS 5.1)"
        run: |
          $out = powershell -NoProfile -File .\install.ps1 -Version
          if ($out -notmatch '^claude-dev-agents \d+\.\d+\.\d+$') {
            Write-Host "FAIL: unexpected output: $out"
            exit 1
          }
          Write-Host "PASS: $out"

      - name: PSScriptAnalyzer (PS 5.1)
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path .\install.ps1 -Settings .\test\PSScriptAnalyzerSettings.psd1
          if ($results | Where-Object { $_.Severity -in 'Error','Warning' }) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PASS: PSScriptAnalyzer clean"

  # ---------------------------------------------------------------------------
  # Job C — PS 7 AST parse + PSScriptAnalyzer (ubuntu, pwsh)
  # Catches the inverse of BL-012: parses under 5.1 but breaks under 7.
  # ---------------------------------------------------------------------------
  static-pwsh7:
    name: "static-pwsh7"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: AST parse (pwsh 7)
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "PASS: install.ps1 parses under pwsh 7"

      - name: PSScriptAnalyzer (pwsh 7)
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./test/PSScriptAnalyzerSettings.psd1
          if ($results | Where-Object { $_.Severity -in 'Error','Warning' }) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PASS: PSScriptAnalyzer clean"

  # ---------------------------------------------------------------------------
  # Job D — smoke tests (matrix: ubuntu, macos, windows)
  # bash smoke runs on ubuntu + macos; PS smoke runs on windows under 5.1 AND pwsh 7
  # ---------------------------------------------------------------------------
  smoke:
    name: "smoke (${{ matrix.label }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
            run-smoke: bash test/smoke.sh
          - os: macos-latest
            label: macos
            run-smoke: bash test/smoke.sh
          - os: windows-latest
            label: "windows PS 5.1"
            run-smoke: powershell -NoProfile -File test/smoke.ps1
          - os: windows-latest
            label: "windows pwsh 7"
            run-smoke: pwsh -NoProfile -File test/smoke.ps1
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        # NOTE: step-level `shell` must be a literal — GitHub rejects the whole
        # workflow file if `shell` contains an expression. bash exists on all
        # three runner OSes and merely launches the real interpreter.
        shell: bash
        run: ${{ matrix.run-smoke }}

  # ---------------------------------------------------------------------------
  # Job E — parity: bash vs pwsh7 manifests must match (ubuntu)
  # ---------------------------------------------------------------------------
  parity:
    name: "parity (bash vs pwsh7)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parity.sh
        run: bash test/parity.sh

  # ---------------------------------------------------------------------------
  # Aggregator — required branch protection check
  # Set "ci-pass" as the required status check; all failures surface in one run.
  # TODO(BL-011): add lint-frontmatter job here (name==filename, required keys,
  #   tools/model values for agents/*.md and skills/*/SKILL.md).
  # ---------------------------------------------------------------------------
  ci-pass:
    name: "ci-pass"
    runs-on: ubuntu-latest
    needs: [static-bash, static-pwsh-windows, static-pwsh7, smoke, parity]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          bad = [k for k,v in d.items() if v['result'] not in ('success','skipped')]
          print('\n'.join(bad))
          ")
          if [ -n "$failed" ]; then
            echo "FAIL: the following jobs did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "PASS: all jobs passed"

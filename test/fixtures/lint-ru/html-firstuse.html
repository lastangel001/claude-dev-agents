<h1>Отчёт</h1>
<p>Фильтр держит 46% посторонних записей, если включён прогретый индекс.</p>
<p><a class="term" href="#g-baseline" title="Общее написание адреса, с которым сравнивают присланную строку.">эталон записи</a> заменяет последнюю присланную строку.</p>
<p>Позже: <a class="term" href="#g-idf" title="Понижает значимость слов, которые встречаются почти в каждом адресе.">прогретый индекс</a> считается по частоте, а эталон записи пересчитывается на каждой загрузке.</p>
